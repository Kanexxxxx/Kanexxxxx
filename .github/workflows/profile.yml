# Sincroniza o perfil a cada 3 horas:
# - linguagens do Stack (cartões + README) a partir dos repositórios públicos;
#   quando mudam, faz commit na main;
# - cartões dinâmicos na branch "output": números com relógio da sincronização,
#   linguagens, progresso dos projetos, cobrinha (Platane/snk) e calendário 3D
#   (github-profile-3d-contrib).
# Se algum passo falhar, a branch output mantém a última versão válida.
name: Sincronizar perfil

on:
  schedule:
    - cron: "17 */3 * * *" # a cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package*.json"
      - "profile.config.json"
      - ".github/profile-3d.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Linguagens do Stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          node scripts/sync-languages.mjs
          git add README.md assets/languages.json assets/svg/tech assets/svg/stack-head-languages.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sincroniza linguagens do Stack"
            git push
          fi

      - name: Cobrinha das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-raw.svg?color_snake=#9aa9ff&color_dots=#141c30,#134a4c,#1f7f72,#3fc0aa,#77ebd7

      - name: Calendário 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Números, linguagens, progresso, cobrinha e 3D em vidro
        run: npm run metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Sincroniza cartões do perfil"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
